@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap');
* { box-sizing: border-box; }
.roster-root { --bg:#e9eff0; --surface:#ffffff; --ink:#12343b; --muted:#5b7178; --line:#d3dee0; --primary:#0e7c86; --primary-d:#0a5b63; --primary-soft:#d6ebed;
  font-family:'Sarabun', system-ui, -apple-system, sans-serif; color:var(--ink); background:var(--bg); min-height:100%; padding:20px 16px 60px; -webkit-font-smoothing:antialiased; }
.wrap { max-width:1360px; margin:0 auto; }
.masthead { display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:16px; }
.title-block .kicker { font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--primary); font-weight:600; }
.title-block h1 { font-size:26px; line-height:1.15; margin:4px 0 2px; font-weight:700; }
.title-block .sub { color:var(--muted); font-size:14px; }
.saved { font-size:12px; color:var(--primary); display:flex; align-items:center; gap:5px; margin-top:6px; }
.saved .dot { width:7px; height:7px; border-radius:50%; background:var(--primary); }
.monthnav { display:flex; align-items:center; gap:8px; }
.selbox { padding:9px 10px; border:1px solid var(--line); border-radius:10px; background:var(--surface); font-family:inherit; font-size:15px; font-weight:600; color:var(--ink); cursor:pointer; }
.selbox:focus { outline:2px solid var(--primary-soft); border-color:var(--primary); }
.iconbtn { width:38px; height:38px; border-radius:10px; border:1px solid var(--line); background:var(--surface); font-size:18px; color:var(--ink); cursor:pointer; line-height:1; }
.iconbtn:hover { border-color:var(--primary); color:var(--primary); }
.toolbar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
.btn { border:none; border-radius:10px; padding:10px 16px; font-family:inherit; font-size:14px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:7px; }
.btn.primary { background:var(--primary); color:#fff; } .btn.primary:hover { background:var(--primary-d); }
.btn.ghost { background:var(--surface); color:var(--ink); border:1px solid var(--line); } .btn.ghost:hover { border-color:var(--primary); color:var(--primary); }
.btn.warn { background:#fff; color:#9c1f2e; border:1px solid #f0a6ad; } .btn.warn:hover { background:#fdeef0; }
.panel { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:16px; }
.panel h2 { font-size:13px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); margin:0 0 12px; font-weight:600; }
.panel .note { font-size:12.5px; color:var(--muted); margin:10px 0 0; line-height:1.55; }
.cfg-grid { display:flex; flex-wrap:wrap; gap:14px 26px; }
.cfg-item { display:flex; flex-direction:column; gap:5px; }
.cfg-item label { font-size:12px; color:var(--muted); font-weight:500; }
.cfg-item .row { display:flex; align-items:center; gap:6px; }
.cfg-sep { width:1px; align-self:stretch; background:var(--line); }
.numinput { width:60px; padding:7px 8px; border:1px solid var(--line); border-radius:8px; font-family:inherit; font-size:15px; text-align:center; color:var(--ink); }
.numinput:focus { outline:2px solid var(--primary-soft); border-color:var(--primary); }
.chip-tag { display:inline-flex; align-items:center; justify-content:center; min-width:26px; height:26px; padding:0 5px; border-radius:7px; font-weight:700; font-size:13px; }
.hol-list { display:flex; flex-wrap:wrap; gap:8px; }
.hol-chip { display:inline-flex; align-items:center; gap:8px; background:#fbeef0; border:1px solid #f2ccd2; border-radius:10px; padding:6px 10px; font-size:13px; }
.hol-chip .d { font-weight:700; color:#c0344a; }
.hol-chip .x { cursor:pointer; border:none; background:transparent; color:#b06; font-size:15px; line-height:1; }
.hol-empty { color:var(--muted); font-size:13px; }
.addhol { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
.addhol input { padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-family:inherit; font-size:14px; }
.addhol input.day { width:70px; text-align:center; } .addhol input.nm { flex:1 1 200px; }
.grp-legend { display:flex; flex-wrap:wrap; gap:14px; margin-bottom:10px; font-size:13px; }
.grp-legend .g { display:flex; align-items:center; gap:7px; }
.grp-legend .bar { width:16px; height:16px; border-radius:4px; }
.nurse-list { display:flex; flex-direction:column; }
.nurse-row { display:flex; align-items:center; gap:10px; text-align:left; min-height:46px; padding:6px 4px 6px 0; border-bottom:1px solid #eef2f3; }
.nurse-row.dragging { opacity:.45; }
.nurse-row.dragover { box-shadow:inset 0 3px 0 var(--primary); background:#eefaf6; }
.nurse-row .grip { cursor:grab; color:#b6c2c6; font-size:18px; line-height:1; padding:0 2px; user-select:none; }
.nurse-row .grip:active { cursor:grabbing; }
.nurse-row:last-child { border-bottom:none; }
.nurse-row .band { width:5px; align-self:stretch; border-radius:3px; }
.nurse-row .idx { color:var(--muted); font-size:12px; min-width:24px; }
.nurse-row .nm { flex:1; font-size:14px; }
.nurse-row .nm-edit { flex:1; font-size:15px; border:1px solid transparent; background:transparent; border-radius:7px; padding:6px 8px; font-family:inherit; color:var(--ink); }
.nurse-row .nm-edit:hover { background:#f4f8f9; }
.nurse-row .nm-edit:focus { border-color:var(--primary); background:#fff; outline:none; }
.nurse-row .mv { width:28px; height:28px; border:1px solid var(--line); background:#fff; border-radius:7px; cursor:pointer; color:var(--muted); font-size:11px; line-height:1; }
.nurse-row .mv:hover:not(:disabled) { border-color:var(--primary); color:var(--primary); }
.nurse-row .mv:disabled { opacity:.3; cursor:default; }
.nurse-row .x { cursor:pointer; width:24px; height:24px; border-radius:6px; border:1px solid transparent; background:transparent; color:var(--muted); font-size:16px; line-height:1; }
.nurse-row .x:hover { background:#fdeef0; color:#9c1f2e; }
.addnurse { display:flex; gap:8px; margin-top:12px; }
.addnurse input { flex:1 1 220px; padding:9px 11px; border:1px solid var(--line); border-radius:8px; font-family:inherit; font-size:14px; }
.addnurse input:focus { outline:2px solid var(--primary-soft); border-color:var(--primary); }
.grid-title { text-align:center; font-weight:700; font-size:15px; color:var(--ink); margin:2px 0 8px; }
.grid-title.screen-only { position:sticky; top:0; z-index:6; background:var(--surface); padding:6px 0; margin:0; border-radius:12px 12px 0 0; }
.screen-only { display:block; } .print-only { display:none; }
.grid-scroll { overflow:visible; border:1px solid var(--line); border-radius:0 0 14px 14px; background:var(--surface); }
table.roster { border-collapse:separate; border-spacing:0; width:100%; table-layout:fixed; font-size:12px; }
table.roster th, table.roster td { border-bottom:1px solid var(--line); border-right:1px solid var(--line); text-align:center; overflow:hidden; }
table.roster th { background:#f4f8f9; font-weight:600; padding:4px 1px; position:sticky; top:34px; z-index:2; cursor:pointer; }
table.roster th.wknd, table.roster td.wknd { background:#eef2ee; }
table.roster th.hol, table.roster td.hol { background:#fbeef0; }
table.roster th.namecol, table.roster td.namecol { position:sticky; left:0; z-index:3; background:var(--surface); text-align:left !important; vertical-align:middle; padding:6px 6px 6px 10px; width:190px; border-right:2px solid var(--line); font-weight:600; cursor:default; font-size:13px; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
th.namecol { z-index:5; background:#f4f8f9; top:34px; }
.daynum { font-weight:700; font-size:12.5px; } .daydow { font-size:9px; color:var(--muted); font-weight:500; }
.holmark { font-size:8px; color:#c0344a; font-weight:700; line-height:1; }
td.cell { padding:0; height:26px; min-width:0; cursor:pointer; }
td.cell:hover { outline:2px solid var(--primary); outline-offset:-2px; z-index:1; position:relative; }
.cellchip { display:flex; align-items:center; justify-content:center; height:100%; width:100%; font-weight:700; font-size:12px; }
.cellchip.small { font-size:12px; }
.cloud-row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:6px; }
.cloud-url { flex:1 1 320px; min-width:220px; padding:9px 11px; border:1px solid var(--line); border-radius:10px; font-family:inherit; font-size:13px; }
.cloud-row .chk { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); }
.syncstate { font-size:13px; color:var(--muted); white-space:nowrap; }
td.celllow { border-top:1px dashed #e6ebec; }
